name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Clipboard history
        - Screenshots
        - Both
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
