name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Validate package manifest
        run: swift package dump-package > /dev/null

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  xcode-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE_APP="$(python3 - <<'PY'
          from pathlib import Path
          import re

          def version_key(path: Path) -> tuple[int, ...]:
              match = re.search(r"Xcode_(\d+(?:\.\d+)*)", path.stem)
              if not match:
                  return (0,)
              return tuple(int(part) for part in match.group(1).split("."))

          apps = sorted(Path("/Applications").glob("Xcode_26*.app"), key=version_key)
          print(apps[-1] if apps else Path("/Applications/Xcode.app"))
          PY
          )"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Build (Xcode scheme)
        run: |
          xcodebuild build \
            -project Edison.xcodeproj \
            -scheme "Edison" \
            -destination "platform=macOS" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
