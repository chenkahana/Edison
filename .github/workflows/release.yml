name: Release

# Every main commit that changes the app becomes a signed, notarized Edison.dmg on GitHub Releases, with the
# appcast.xml that Sparkle in installed copies reads from releases/latest. See docs/release.md.
on:
  push:
    branches: [main]
    paths:
      - Edison/**
      - Config/**
      - Assets.xcassets/**
      - Edison.xcodeproj/**
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign, notarize and package without publishing
        type: boolean
        default: true

# One release at a time, and none cancelled halfway through notarization.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  APP_NAME: Edison - Clipboard Manager.app
  TEAM_ID: DPF8459C2J

jobs:
  release:
    name: Build, notarize and publish Edison.dmg
    # Xcode 27: the macOS 27 image-caption path (FoundationModels) only compiles with Swift 6.4.
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          DEVELOPER_ID_KEY: ${{ secrets.DEVELOPER_ID_KEY }}
        run: |
          missing=()
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 SPARKLE_ED_PRIVATE_KEY DEVELOPER_ID_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} (run scripts/set-release-secrets.sh, see docs/release.md)"
            exit 1
          fi

      - name: Choose the version
        # CHANGELOG's newest "## X.Y[.Z] — YYYY-MM-DD" when it is newer than every v* tag, with that section as the
        # notes; otherwise the next patch, with the commit subject as the notes. CI never edits CHANGELOG.md.
        run: |
          latest=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's|.*refs/tags/v||' \
            | { grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || true; } | sort -V | tail -1)
          heading=$(grep -m1 -E '^## [0-9]' CHANGELOG.md || true)
          if [[ "$heading" == *unreleased* ]]; then
            echo "::error::CHANGELOG.md's newest section says \"$heading\": give it the release date"
            exit 1
          fi
          top=$(grep -oE '^## [0-9]+\.[0-9]+(\.[0-9]+)? — [0-9]{4}-[0-9]{2}-[0-9]{2}$' <<< "$heading" | cut -d' ' -f2 || true)
          notes="$RUNNER_TEMP/notes.md"
          if [ -n "$top" ] && { [ -z "$latest" ] || [ "$(printf '%s\n%s\n' "$latest" "$top" | sort -V | tail -1)" != "$latest" ]; }; then
            version=$top
            awk -v heading="## $top — " 'index($0, heading) == 1 {on = 1; next} on && /^## / {exit} on' CHANGELOG.md \
              | sed -e '/./,$!d' > "$notes"
          else
            IFS=. read -r major minor patch <<< "${latest:-0.0.0}"
            version="$major.$minor.$((${patch:-0} + 1))"
            git log -1 --format=%s > "$notes"
          fi
          printf '\n---\nOpen the DMG and drag Edison to Applications. Requires macOS 14 or later. Signed with Developer ID and notarized by Apple. Installed copies update themselves.\n' >> "$notes"
          {
            echo "VERSION=$version"
            # Sparkle compares build numbers: the release time keeps each one newer than the last.
            echo "BUILD=$(date -u +%Y%m%d%H%M)"
            echo "NOTES=$notes"
            echo "OUT=$RUNNER_TEMP/release-build"
          } >> "$GITHUB_ENV"
          echo "Releasing $version (latest tag: ${latest:-none})"
          cat "$notes"

      - name: Select the newest Xcode 27
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version
          swift --version

      - name: Install the signing keys
        # The Developer ID key signs with its certificate, which scripts/developer-id.py finds with the API key; the
        # API key also notarizes. The keychain and key files are removed in the last step.
        id: keys
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          DEVELOPER_ID_KEY: ${{ secrets.DEVELOPER_ID_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          umask 077
          keys="$RUNNER_TEMP/keys"
          mkdir -p "$keys"
          printf '%s\n' "$ASC_KEY_P8" > "$keys/asc.p8"
          printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" > "$keys/sparkle.key"
          printf '%s\n' "$DEVELOPER_ID_KEY" > "$keys/developer-id.key"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          {
            echo "ASC_KEY_PATH=$keys/asc.p8"
            echo "SPARKLE_KEY_FILE=$keys/sparkle.key"
            echo "KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          ASC_KEY_PATH="$keys/asc.p8" python3 scripts/developer-id.py install \
            --key "$keys/developer-id.key" --keychain "$keychain" --state "$RUNNER_TEMP/signing"
          rm "$keys/developer-id.key"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          read -r -a searched <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$keychain" "${searched[@]}"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*\([0-9A-F]\{40\}\) "Developer ID Application:.*/\1/p' | head -1)
          [ -n "$identity" ] || { echo "::error::No valid Developer ID Application identity after importing the key"; exit 1; }
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Archive and export with Developer ID
        # The DMG target (with Sparkle). Its entitlements need no provisioning profile, so signing is manual.
        env:
          IDENTITY: ${{ steps.keys.outputs.identity }}
        run: |
          mkdir -p "$OUT"
          xcodebuild archive -project Edison.xcodeproj -scheme "Edison DMG" -configuration Release \
            -destination 'generic/platform=macOS' -archivePath "$OUT/Edison.xcarchive" \
            -clonedSourcePackagesDirPath "$OUT/SourcePackages" -quiet \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$IDENTITY" DEVELOPMENT_TEAM="$TEAM_ID"
          cat > "$OUT/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>developer-id</string>
              <key>teamID</key><string>$TEAM_ID</string>
              <key>signingStyle</key><string>manual</string>
              <key>signingCertificate</key><string>$IDENTITY</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$OUT/Edison.xcarchive" -exportPath "$OUT/export" \
            -exportOptionsPlist "$OUT/ExportOptions.plist" -quiet
          echo "SPARKLE_BIN=$OUT/SourcePackages/artifacts/sparkle/Sparkle/bin" >> "$GITHUB_ENV"

      - name: Notarize
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          app="$OUT/export/$APP_NAME"
          ditto -c -k --keepParent "$app" "$OUT/Edison.zip"
          credentials=(--key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID")
          xcrun notarytool submit "$OUT/Edison.zip" "${credentials[@]}" --wait --timeout 1h \
            --output-format json > "$OUT/notarization.json" || true
          cat "$OUT/notarization.json"
          status=$(plutil -extract status raw "$OUT/notarization.json")
          if [ "$status" != Accepted ]; then
            xcrun notarytool log "$(plutil -extract id raw "$OUT/notarization.json")" "${credentials[@]}" || true
            echo "::error::Notarization finished as $status"
            exit 1
          fi
          xcrun stapler staple "$app"

      - name: Make the DMG and sign it for Sparkle
        run: |
          mkdir -p "$OUT/dmg"
          cp -R "$OUT/export/$APP_NAME" "$OUT/dmg/"
          ln -s /Applications "$OUT/dmg/Applications"
          hdiutil create -volname Edison -srcfolder "$OUT/dmg" -fs HFS+ -format UDZO -ov "$OUT/Edison.dmg" -quiet
          (cd "$OUT" && shasum -a 256 Edison.dmg > Edison.dmg.sha256 && cat Edison.dmg.sha256)
          echo "SIGNATURE=$("$SPARKLE_BIN/sign_update" -p --ed-key-file "$SPARKLE_KEY_FILE" "$OUT/Edison.dmg")" >> "$GITHUB_ENV"

      - name: Verify the DMG
        run: |
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$OUT/Edison.dmg" > /dev/null
          trap 'hdiutil detach -quiet "$mount"' EXIT
          app="$mount/$APP_NAME"
          gatekeeper=$(spctl -a -t exec -vv "$app" 2>&1)
          [[ "$gatekeeper" == *'Notarized Developer ID'* ]] \
            || { echo "::error::Gatekeeper does not accept Edison as notarized Developer ID: $gatekeeper"; exit 1; }
          xcrun stapler validate "$app"
          codesign --verify --deep --strict "$app"
          info="$app/Contents/Info.plist"
          shown=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$info")
          [ "$shown" = "$VERSION" ] || { echo "::error::Edison is version $shown, not $VERSION"; exit 1; }
          [ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$info")" = "$BUILD" ] \
            || { echo "::error::Edison's build number isn't $BUILD"; exit 1; }
          echo "MINIMUM=$(/usr/libexec/PlistBuddy -c 'Print LSMinimumSystemVersion' "$info")" >> "$GITHUB_ENV"
          # Installed copies take the update only if it verifies against the public key they carry.
          cat > "$RUNNER_TEMP/verify.swift" <<'EOF'
          import CryptoKit
          import Foundation

          let arguments = CommandLine.arguments
          let key = try Curve25519.Signing.PublicKey(rawRepresentation: Data(base64Encoded: arguments[1])!)
          let update = try Data(contentsOf: URL(fileURLWithPath: arguments[3]))
          exit(key.isValidSignature(Data(base64Encoded: arguments[2])!, for: update) ? 0 : 1)
          EOF
          swift "$RUNNER_TEMP/verify.swift" "$(/usr/libexec/PlistBuddy -c 'Print SUPublicEDKey' "$info")" "$SIGNATURE" "$OUT/Edison.dmg" \
            || { echo "::error::The DMG's EdDSA signature doesn't match SUPublicEDKey: SPARKLE_ED_PRIVATE_KEY is the wrong key"; exit 1; }
          (cd "$OUT" && shasum -a 256 -c Edison.dmg.sha256)

      - name: Write the appcast
        run: |
          release="$RUNNER_TEMP/release"
          mkdir -p "$release"
          cp "$OUT/Edison.dmg" "$OUT/Edison.dmg.sha256" "$release/"
          download="https://github.com/$GITHUB_REPOSITORY/releases"
          cat > "$release/appcast.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
              <channel>
                  <title>Edison</title>
                  <item>
                      <title>Edison $VERSION</title>
                      <pubDate>$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                      <sparkle:version>$BUILD</sparkle:version>
                      <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                      <sparkle:minimumSystemVersion>$MINIMUM</sparkle:minimumSystemVersion>
                      <sparkle:releaseNotesLink>$download/tag/v$VERSION</sparkle:releaseNotesLink>
                      <enclosure url="$download/download/v$VERSION/Edison.dmg"
                                 length="$(stat -f%z "$release/Edison.dmg")" type="application/octet-stream"
                                 sparkle:edSignature="$SIGNATURE"/>
                  </item>
              </channel>
          </rss>
          EOF
          xmllint --noout "$release/appcast.xml"
          cat "$release/appcast.xml"
          echo "RELEASE=$release" >> "$GITHUB_ENV"

      - name: Publish
        if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
        run: |
          cd "$RELEASE"
          # Installed copies read the newest release's appcast: releases/latest/download/appcast.xml (SUFeedURL).
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Edison $VERSION" --notes-file "$NOTES" Edison.dmg Edison.dmg.sha256 appcast.xml
          sleep 5
          served=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml")
          [[ "$served" == *"<sparkle:shortVersionString>$VERSION<"* ]] \
            || { echo "::error::releases/latest does not serve the $VERSION appcast"; exit 1; }

      - name: Keep the dry-run DMG
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Edison-${{ env.VERSION }}
          path: ${{ env.RELEASE }}
          retention-days: 3

      - name: Remove the signing keys
        if: always()
        run: |
          [ -z "${KEYCHAIN:-}" ] || security delete-keychain "$KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/signing"
